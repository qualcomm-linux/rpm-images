name: Build RPM images

on:
  workflow_call:
    outputs:
      artifacts_url:
        description: "URL to retrieve build artifacts"
        value: ${{ jobs.publish-artifacts.outputs.url }}

permissions:
  contents: read
  packages: read

# Concurrency is used to prevent multiple workflows from running for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: true

env:
  BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  FILESERVER_URL: "https://qli-prod-artifacts.qualcomm.com"
  EFS_ROOT: /efs/qli/rpm-images
  EFS_BUILD_DIR: /efs/qli/rpm-images/${{ github.run_id }}

jobs:

  kernel-rpm:
    name: Phase 1 - Kernel RPM
    if: github.repository_owner == 'qualcomm-linux'
    runs-on: [self-hosted, platform-prd-u2404-arm64-large-od-ephem]
    outputs:
      manifest_sha256: ${{ steps.stage.outputs.manifest_sha256 }}
    container:
      image: ghcr.io/qualcomm-linux/rpm-builder:centos10
      options: --user 0:0
      # only expose this project's directory, not the whole shared mount
      volumes:
        - /efs/qli/rpm-images:/efs/qli/rpm-images
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Record workspace owner
        run: |
          set -euo pipefail
          owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          echo "Workspace owner: ${owner}"
          echo "WORKSPACE_OWNER=${owner}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build kernel RPMs
        uses: ./.github/actions/build-kernel-rpm
        with:
          kernel-ref: qcom-6.18.y-20261126

      - name: Stage kernel artifacts to EFS
        id: stage
        run: |
          set -euo pipefail
          out=efs-out/kernel
          dest="${EFS_BUILD_DIR}/kernel"
          rm -rf "${out}"
          mkdir -vp "${out}/rpms" "${out}/srpms" "${out}/vmlinux"
          cp -av linux/rpmbuild/RPMS/aarch64/kernel-*.rpm "${out}/rpms/"
          #  copy SRPM only if present
          shopt -s nullglob
          srpms=(linux/rpmbuild/SRPMS/kernel-*.src.rpm)
          shopt -u nullglob
          if (( ${#srpms[@]} > 0 )); then
            cp -av "${srpms[@]}" "${out}/srpms/"
          fi
          cp -av linux/vmlinux "${out}/vmlinux/"
          (cd "${out}" && find . -type f ! -name SHA256SUMS -print0 | sort -z \
            | xargs -0 sha256sum > SHA256SUMS)
          cat "${out}/SHA256SUMS"
          echo "manifest_sha256=$(sha256sum "${out}/SHA256SUMS" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # start clean in case this is a full re-run of the same run_id
          rm -rf "${dest}"
          mkdir -p "$(dirname "${dest}")"
          cp -a "${out}" "${dest}"
          # perhaps help NFS sync
          sync

      - name: Hand workspace and EFS artifacts back to runner user
        if: always()
        run: |
          set -euo pipefail
          chown -R "${WORKSPACE_OWNER}" "$GITHUB_WORKSPACE" || true
          chown -R "${WORKSPACE_OWNER}" "${EFS_BUILD_DIR}" || true


  publish-kernel-rpms:
    name: Publish kernel RPMs to S3
    if: github.repository_owner == 'qualcomm-linux'
    needs: kernel-rpm
    runs-on: [self-hosted, platform-prd-u2404-arm64-large-od-ephem]
    steps:
      - name: Fetch kernel artifacts from EFS
        env:
          MANIFEST_SHA256: ${{ needs.kernel-rpm.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          rm -rf kernel && cp -a "${EFS_BUILD_DIR}/kernel" kernel
          echo "${MANIFEST_SHA256}  kernel/SHA256SUMS" | sha256sum -c -
          # reject links and other non-regular entries, and any file that
          # isn't in the manifest: sha256sum -c only checks the listed ones
          if [ -n "$(find kernel ! -type f ! -type d -print -quit)" ]; then
            echo "Non-regular entry in kernel" >&2
            exit 1
          fi
          diff -u <(cut -d' ' -f3- kernel/SHA256SUMS | LC_ALL=C sort) \
                  <(cd kernel && find . -type f ! -path ./SHA256SUMS | LC_ALL=C sort) \
            || { echo "Files in kernel don't match its manifest" >&2; exit 1; }
          (cd kernel && sha256sum -c SHA256SUMS)

      - name: Stage kernel RPMs for publishing
        run: |
          set -euo pipefail
          mkdir -p kernel-rpms
          shopt -s nullglob
          cp -av kernel/rpms/kernel-*.rpm kernel/srpms/*.src.rpm kernel-rpms/
          (cd kernel-rpms && sha256sum $(find . -maxdepth 1 -type f) | tee sha256sums.txt)

      - name: Publish kernel RPMs (S3)
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        id: upload_kernel_s3
        with:
          path: kernel-rpms
          s3_bucket: qli-prd-platform-gh-artifacts
          destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ env.BUILD_ID }}/kernel-rpms/
          fileserver_url: ${{ env.FILESERVER_URL }}

      - name: Print kernel RPM download URL
        env:
          kernel_url: ${{ steps.upload_kernel_s3.outputs.url }}
        run: |
          echo "Kernel RPMs URL: ${kernel_url}"
          echo "## Kernel RPMs URL" >> $GITHUB_STEP_SUMMARY
          echo "[${kernel_url}](${kernel_url})" >> $GITHUB_STEP_SUMMARY


  build-and-flash:
    name: Phase 2 - Images, extract & flash packages (${{ matrix.image_family }})
    if: github.repository_owner == 'qualcomm-linux'
    needs: [kernel-rpm]
    runs-on: [self-hosted, platform-prd-u2404-arm64-large-od-ephem]
    # one output per matrix leg: each leg sets only its own key, so the
    # values don't overwrite each other when the matrix outputs are merged
    outputs:
      manifest_sha256_console: ${{ steps.stage_efs.outputs.manifest_sha256_console }}
      manifest_sha256_gnome: ${{ steps.stage_efs.outputs.manifest_sha256_gnome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_family: console
            kiwi_profile: console
            variants: "console console-perf"
          - image_family: gnome
            kiwi_profile: gnome
            variants: "gnome gnome-perf"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install host dependencies
        uses: ./.github/actions/install-host-deps

      - name: Fetch kernel artifacts from EFS
        env:
          MANIFEST_SHA256: ${{ needs.kernel-rpm.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          rm -rf kernel && cp -a "${EFS_BUILD_DIR}/kernel" kernel
          echo "${MANIFEST_SHA256}  kernel/SHA256SUMS" | sha256sum -c -
          # reject links and other non-regular entries, and any file that
          # isn't in the manifest: sha256sum -c only checks the listed ones
          if [ -n "$(find kernel ! -type f ! -type d -print -quit)" ]; then
            echo "Non-regular entry in kernel" >&2
            exit 1
          fi
          diff -u <(cut -d' ' -f3- kernel/SHA256SUMS | LC_ALL=C sort) \
                  <(cd kernel && find . -type f ! -path ./SHA256SUMS | LC_ALL=C sort) \
            || { echo "Files in kernel don't match its manifest" >&2; exit 1; }
          (cd kernel && sha256sum -c SHA256SUMS)

      - name: Stage kernel RPMs
        run: |
          set -euo pipefail
          mkdir -p packages
          cp -av kernel/rpms/*.rpm packages/

      - name: Stage kernel vmlinux ELF
        run: |
          set -euo pipefail
          mkdir -p linux
          cp -av kernel/vmlinux/vmlinux linux/vmlinux
          file linux/vmlinux || true

      - name: Write build ID into kiwi root overlay
        run: |
          set -euo pipefail
          mkdir -p kiwi/root/etc
          printf 'BUILD_ID=%s\n' "${BUILD_ID}" > kiwi/root/etc/buildinfo
          chmod 644 kiwi/root/etc/buildinfo

      - name: Build image, extract, and assemble flash packages
        run: |
          set -euo pipefail

          build_variant() {
            local variant="$1"
            local perf_build="$2"

            echo "::group::Build ${variant}"
            sudo HOME=/tmp make flash \
              KIWI_PROFILE="${{ matrix.kiwi_profile }}" \
              PERF_BUILD="${perf_build}" \
              BUILD_OUTPUT="build/output" \
              KIWI_SHARED_CACHE="build/kiwi-cache" \
              ARTIFACTDIR="build/out" \
              TARGET_BOARDS=qcs6490-rb3gen2 \
              USE_FIT_IMAGE=1 \
              KVM_CONFIG=1 \
              EXTRA_FLASH_OPTS=--verbose=true
            echo "::endgroup::"
          }

          build_variant "${{ matrix.image_family }}" 0
          build_variant "${{ matrix.image_family }}-perf" 1

          sudo chown -R "$(id -u):$(id -g)" build
          if [ -e downloads ]; then
            sudo chown -R "$(id -u):$(id -g)" downloads
          fi

      - name: Install cosign
        # Required so the syft installer can verify the release signature (-v).
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install Syft
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh -o install-syft.sh
          sh install-syft.sh -v
          rm -f install-syft.sh

      - name: Generate SBOM with Syft
        run: |
          set -euo pipefail

          scan_variant() {
            local variant="$1"
            local mount_dir="rootfs-mount-${variant}"

            echo "::group::SBOM ${variant}"
            mkdir -p "${mount_dir}"
            cleanup() {
              if mountpoint -q "${mount_dir}"; then
                sudo umount "${mount_dir}"
              fi
            }
            trap cleanup EXIT
            sudo mount -o ro "build/output/${variant}/flashimages/rootfs.img" "${mount_dir}"
            SYFT_FORMAT_PRETTY=true bin/syft \
                -o "cyclonedx-json=rootfs-sbom-${variant}.cyclonedx.json" \
                -o "spdx-json=rootfs-sbom-${variant}.spdx.json" \
                -o "syft-json=rootfs-sbom-${variant}.syft.json" \
                -o "syft-text=rootfs-sbom-${variant}.syft.txt" \
                -o syft-table \
                --parallelism "$(nproc)" \
                --select-catalogers rpm \
                --source-name "qualcomm-linux-rpm-${variant}-rootfs" \
                --source-version "${BUILD_ID}" \
                -v \
                scan "${mount_dir}"
            cleanup
            trap - EXIT
            echo "::endgroup::"
          }

          for variant in ${{ matrix.variants }}; do
            scan_variant "${variant}"
          done

      - name: Stage flash packages for publishing
        run: |
          set -euo pipefail
          mkdir -p rpm-artifacts

          shopt -s nullglob
          for d in build/out/*flash_*; do
            [ -d "$d" ] || continue
            board="$(basename "$d")"
            tar -czf "rpm-artifacts/${board}.tar.gz" -C "$d" .
          done
          shopt -u nullglob
          test -n "$(find rpm-artifacts -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"


      - name: Stage SBOMs for publishing
        run: |
          set -euo pipefail
          mkdir -p sboms
          shopt -s nullglob
          for variant in ${{ matrix.variants }}; do
            for f in rootfs-sbom-${variant}.*; do
              gzip -c "$f" > "sboms/${f}.gz"
            done
          done
          shopt -u nullglob
          test -n "$(find sboms -maxdepth 1 -type f -name '*.gz' -print -quit)"

      - name: Stage flash packages and SBOMs to EFS
        id: stage_efs
        env:
          IMAGE_FAMILY: ${{ matrix.image_family }}
        run: |
          set -euo pipefail
          out="efs-out/images/${IMAGE_FAMILY}"
          dest="${EFS_BUILD_DIR}/images/${IMAGE_FAMILY}"
          rm -rf "${out}"
          mkdir -vp "${out}/rpm-artifacts" "${out}/sboms"
          cp -av rpm-artifacts/*.tar.gz "${out}/rpm-artifacts/"
          cp -av sboms/*.gz "${out}/sboms/"
          (cd "${out}" && find . -type f ! -name SHA256SUMS -print0 | sort -z \
            | xargs -0 sha256sum > SHA256SUMS)
          cat "${out}/SHA256SUMS"
          echo "manifest_sha256_${IMAGE_FAMILY}=$(sha256sum "${out}/SHA256SUMS" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          rm -rf "${dest}"
          mkdir -p "$(dirname "${dest}")"
          cp -a "${out}" "${dest}"
          # perhaps help NFS sync
          sync


  publish-artifacts:
    name: Publish flash packages and SBOMs to S3
    if: github.repository_owner == 'qualcomm-linux'
    needs: [build-and-flash]
    runs-on: [self-hosted, platform-prd-u2404-arm64-large-od-ephem]
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - name: Fetch flash packages and SBOMs from EFS
        env:
          # keep in sync with the build-and-flash matrix
          MANIFESTS: >-
            console=${{ needs.build-and-flash.outputs.manifest_sha256_console }}
            gnome=${{ needs.build-and-flash.outputs.manifest_sha256_gnome }}
        run: |
          set -euo pipefail
          rm -rf images && mkdir -p images
          for entry in ${MANIFESTS}; do
            family="${entry%%=*}"
            sum="${entry#*=}"
            if [ -z "${sum}" ]; then
              echo "No manifest checksum for ${family}" >&2
              exit 1
            fi
            cp -a "${EFS_BUILD_DIR}/images/${family}" "images/${family}"
            echo "${sum}  images/${family}/SHA256SUMS" | sha256sum -c -
            # reject links and other non-regular entries, and any file that
            # isn't in the manifest: sha256sum -c only checks the listed ones
            if [ -n "$(find "images/${family}" ! -type f ! -type d -print -quit)" ]; then
              echo "Non-regular entry in images/${family}" >&2
              exit 1
            fi
            diff -u <(cut -d' ' -f3- "images/${family}"/SHA256SUMS | LC_ALL=C sort) \
                    <(cd "images/${family}" && find . -type f ! -path ./SHA256SUMS | LC_ALL=C sort) \
              || { echo "Files in images/${family} don't match its manifest" >&2; exit 1; }
            (cd "images/${family}" && sha256sum -c SHA256SUMS)
          done

      - name: Stage flash packages for publishing
        run: |
          set -euo pipefail
          mkdir -p rpm-artifacts
          find images -path '*/rpm-artifacts/*.tar.gz' -type f -exec cp -a {} rpm-artifacts/ \;
          test -n "$(find rpm-artifacts -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          (cd rpm-artifacts && sha256sum $(find . -maxdepth 1 -type f) | tee sha256sums.txt)

      - name: Upload artifacts (S3)
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        id: upload_artifacts_s3
        with:
          path: rpm-artifacts
          s3_bucket: qli-prd-platform-gh-artifacts
          destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ env.BUILD_ID }}/
          fileserver_url: ${{ env.FILESERVER_URL }}

      - name: Stage SBOMs for publishing
        run: |
          set -euo pipefail
          mkdir -p sboms
          find images -path '*/sboms/*.gz' -type f -exec cp -a {} sboms/ \;
          test -n "$(find sboms -maxdepth 1 -type f -name '*.gz' -print -quit)"

      - name: Upload SBOMs (S3)
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        id: upload_sboms_s3
        with:
          path: sboms
          s3_bucket: qli-prd-platform-gh-artifacts
          destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ env.BUILD_ID }}/sboms/
          fileserver_url: ${{ env.FILESERVER_URL }}

      - name: Print download URL
        id: url
        env:
          build_url: ${{ steps.upload_artifacts_s3.outputs.url }}
        run: |
          fallback='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          url="${build_url:-$fallback}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Downloads URL: ${url}"
          echo "## Download URL" >> $GITHUB_STEP_SUMMARY
          echo "[${url}](${url})" >> $GITHUB_STEP_SUMMARY


  build-successful:
    name: Build Successful
    needs: [publish-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Print download URL
        env:
          build_url: ${{ needs.publish-artifacts.outputs.url }}
        run: |
          echo "Downloads URL: ${build_url}"
          echo "## Download URL" >> $GITHUB_STEP_SUMMARY
          echo "[${build_url}](${build_url})" >> $GITHUB_STEP_SUMMARY


  # Only clean up after a fully successful run: a failed run keeps its
  # artifacts so "Re-run failed jobs" can still find the kernel RPMs.
  # Failed or cancelled runs are pruned by age in efs-maintenance.yml.
  cleanup-efs:
    name: Clean up EFS build folder
    if: github.repository_owner == 'qualcomm-linux'
    needs: [publish-kernel-rpms, publish-artifacts]
    runs-on: [self-hosted, platform-prd-u2404-arm64-large-od-ephem]
    steps:
      - name: Remove EFS build folder
        run: |
          set -euo pipefail
          case "${EFS_BUILD_DIR}" in
            "${EFS_ROOT}"/?*) ;;
            *) echo "Refusing to delete unexpected path: '${EFS_BUILD_DIR}'" >&2; exit 1 ;;
          esac
          if [ -d "${EFS_BUILD_DIR}" ]; then
            echo "Removing ${EFS_BUILD_DIR}"
            sudo rm -rf "${EFS_BUILD_DIR}"
          else
            echo "Nothing to clean: ${EFS_BUILD_DIR} does not exist"
          fi
