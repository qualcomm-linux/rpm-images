name: Build RPM images

on:
  workflow_call:
    outputs:
      artifacts_url:
        description: "URL to retrieve build artifacts"
        value: ${{ jobs.publish-artifacts.outputs.url }}

permissions:
  contents: read
  packages: read

# Concurrency is used to prevent multiple workflows from running for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: true

env:
  BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  FILESERVER_URL: "https://qli-prod-artifacts.qualcomm.com"

jobs:

  kernel-rpm:
    name: Phase 1 - Kernel RPM
    runs-on: [self-hosted, platform-prd-u2404-arm64-large-od-ephem]
    container:
      image: ghcr.io/qualcomm-linux/rpm-builder:centos10
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Record workspace owner
        run: |
          set -euo pipefail
          owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          echo "Workspace owner: ${owner}"
          echo "WORKSPACE_OWNER=${owner}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build kernel RPMs
        uses: ./.github/actions/build-kernel-rpm
        with:
          kernel-ref: qcom-6.18.y-20260911

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kernel-artifacts
          if-no-files-found: error
          path: |
            linux/rpmbuild/RPMS/aarch64/kernel-*.rpm
            linux/rpmbuild/SRPMS/kernel-*.src.rpm
          retention-days: 1

      - name: Upload kernel vmlinux ELF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kernel-vmlinux
          if-no-files-found: error
          path: linux/vmlinux
          retention-days: 1

      - name: Hand workspace back to runner user
        if: always()
        run: |
          set -euo pipefail
          chown -R "${WORKSPACE_OWNER}" "$GITHUB_WORKSPACE" || true


  publish-kernel-rpms:
    name: Publish kernel RPMs to S3
    needs: kernel-rpm
    runs-on: [self-hosted, platform-prd-u2404-arm64-large-od-ephem]
    steps:
      - name: Download kernel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kernel-artifacts
          path: kernel-artifacts

      - name: Stage kernel RPMs for publishing
        run: |
          set -euo pipefail
          mkdir -p kernel-rpms
          cp -a kernel-artifacts/RPMS/aarch64/kernel-*.rpm kernel-rpms/ 2>/dev/null || true
          cp -a kernel-artifacts/SRPMS/kernel-*.src.rpm    kernel-rpms/ 2>/dev/null || true
          (cd kernel-rpms && sha256sum $(find . -maxdepth 1 -type f) | tee sha256sums.txt)

      - name: Publish kernel RPMs (S3)
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        id: upload_kernel_s3
        with:
          path: kernel-rpms
          s3_bucket: qli-prd-platform-gh-artifacts
          destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ env.BUILD_ID }}/kernel-rpms/
          fileserver_url: ${{ env.FILESERVER_URL }}

      - name: Print kernel RPM download URL
        env:
          kernel_url: ${{ steps.upload_kernel_s3.outputs.url }}
        run: |
          echo "Kernel RPMs URL: ${kernel_url}"
          echo "## Kernel RPMs URL" >> $GITHUB_STEP_SUMMARY
          echo "[${kernel_url}](${kernel_url})" >> $GITHUB_STEP_SUMMARY


  build-and-flash:
    name: Phase 2 - Image, extract & flash packages (${{ matrix.profile }})
    needs: [kernel-rpm]
    runs-on: [self-hosted, platform-prd-u2404-arm64-large-od-ephem]
    strategy:
      fail-fast: false
      matrix:
        profile: [console, console-performance, gnome, gnome-performance]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install host dependencies
        uses: ./.github/actions/install-host-deps

      - name: Download kernel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kernel-artifacts
          path: kernel-artifacts

      - name: Stage kernel RPMs
        run: |
          set -euo pipefail
          mkdir -p packages
          cp kernel-artifacts/RPMS/aarch64/*.rpm packages/

      - name: Download kernel vmlinux ELF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kernel-vmlinux
          path: kernel-vmlinux

      - name: Stage kernel vmlinux ELF
        run: |
          set -euo pipefail
          mkdir -p linux
          cp kernel-vmlinux/vmlinux linux/vmlinux
          file linux/vmlinux || true

      - name: Write build ID into kiwi root overlay
        run: |
          set -euo pipefail
          mkdir -p kiwi/root/etc
          printf 'BUILD_ID=%s\n' "${BUILD_ID}" > kiwi/root/etc/buildinfo
          chmod 644 kiwi/root/etc/buildinfo

      - name: Build image, extract, and assemble flash packages
        run: |
          set -euo pipefail
          profile="${{ matrix.profile }}"

          sudo HOME=/tmp make flash \
            KIWI_PROFILE="${profile}" \
            BUILD_OUTPUT="build/output/${profile}" \
            ARTIFACTDIR="build/out" \
            TARGET_BOARDS=qcs6490-rb3gen2 \
            USE_FIT_IMAGE=1 \
            EXTRA_FLASH_OPTS=--verbose=true

          sudo chown -R "$(id -u):$(id -g)" build
          if [ -e downloads ]; then
            sudo chown -R "$(id -u):$(id -g)" downloads
          fi

      - name: Install cosign
        # Required so the syft installer can verify the release signature (-v).
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh -o install-syft.sh
          sh install-syft.sh -v
          rm -f install-syft.sh

      - name: Generate SBOM with Syft
        run: |
          set -euo pipefail
          profile="${{ matrix.profile }}"
          mount_dir="rootfs-mount-${profile}"
          mkdir -p "${mount_dir}"
          cleanup() {
            if mountpoint -q "${mount_dir}"; then
              sudo umount "${mount_dir}"
            fi
          }
          trap cleanup EXIT
          sudo mount -o ro "build/output/${profile}/flashimages/rootfs.img" "${mount_dir}"
          SYFT_FORMAT_PRETTY=true bin/syft \
              -o "cyclonedx-json=rootfs-sbom-${profile}.cyclonedx.json" \
              -o "spdx-json=rootfs-sbom-${profile}.spdx.json" \
              -o "syft-json=rootfs-sbom-${profile}.syft.json" \
              -o "syft-text=rootfs-sbom-${profile}.syft.txt" \
              -o syft-table \
              --parallelism "$(nproc)" \
              --select-catalogers rpm \
              --source-name "qualcomm-linux-rpm-${profile}-rootfs" \
              --source-version "${BUILD_ID}" \
              -v \
              scan "${mount_dir}"
          cleanup
          trap - EXIT

      - name: Stage flash packages for publishing
        run: |
          set -euo pipefail
          mkdir -p rpm-artifacts

          shopt -s nullglob
          for d in build/out/*flash_*; do
            [ -d "$d" ] || continue
            board="$(basename "$d")"
            tar -czf "rpm-artifacts/${board}.tar.gz" -C "$d" .
          done
          shopt -u nullglob
          test -n "$(find rpm-artifacts -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"

      - name: Upload flash package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rpm-artifacts-${{ matrix.profile }}
          if-no-files-found: error
          path: rpm-artifacts
          retention-days: 1

      - name: Stage SBOMs for publishing
        run: |
          set -euo pipefail
          profile="${{ matrix.profile }}"
          mkdir -p sboms
          shopt -s nullglob
          for f in rootfs-sbom-${profile}.*; do
            gzip -c "$f" > "sboms/${f}.gz"
          done
          shopt -u nullglob
          test -n "$(find sboms -maxdepth 1 -type f -name '*.gz' -print -quit)"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sboms-${{ matrix.profile }}
          if-no-files-found: error
          path: sboms
          retention-days: 1


  publish-artifacts:
    name: Publish flash packages and SBOMs to S3
    needs: [build-and-flash]
    runs-on: [self-hosted, platform-prd-u2404-arm64-large-od-ephem]
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - name: Download flash package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: rpm-artifacts-*
          path: downloaded

      - name: Download SBOM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sboms-*
          path: downloaded

      - name: Stage flash packages for publishing
        run: |
          set -euo pipefail
          mkdir -p rpm-artifacts
          find downloaded -path '*/rpm-artifacts-*/*.tar.gz' -type f -exec cp -a {} rpm-artifacts/ \;
          test -n "$(find rpm-artifacts -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          (cd rpm-artifacts && sha256sum $(find . -maxdepth 1 -type f) | tee sha256sums.txt)

      - name: Upload artifacts (S3)
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        id: upload_artifacts_s3
        with:
          path: rpm-artifacts
          s3_bucket: qli-prd-platform-gh-artifacts
          destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ env.BUILD_ID }}/
          fileserver_url: ${{ env.FILESERVER_URL }}

      - name: Stage SBOMs for publishing
        run: |
          set -euo pipefail
          mkdir -p sboms
          find downloaded -path '*/sboms-*/*.gz' -type f -exec cp -a {} sboms/ \;
          test -n "$(find sboms -maxdepth 1 -type f -name '*.gz' -print -quit)"

      - name: Upload SBOMs (S3)
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        id: upload_sboms_s3
        with:
          path: sboms
          s3_bucket: qli-prd-platform-gh-artifacts
          destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ env.BUILD_ID }}/sboms/
          fileserver_url: ${{ env.FILESERVER_URL }}

      - name: Print download URL
        id: url
        env:
          build_url: ${{ steps.upload_artifacts_s3.outputs.url }}
        run: |
          fallback='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          url="${build_url:-$fallback}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Downloads URL: ${url}"
          echo "## Download URL" >> $GITHUB_STEP_SUMMARY
          echo "[${url}](${url})" >> $GITHUB_STEP_SUMMARY
  

  build-successful:
    name: Build Successful
    needs: [publish-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Print download URL
        env:
          build_url: ${{ needs.publish-artifacts.outputs.url }}
        run: |
          echo "Downloads URL: ${build_url}"
          echo "## Download URL" >> $GITHUB_STEP_SUMMARY
          echo "[${build_url}](${build_url})" >> $GITHUB_STEP_SUMMARY
